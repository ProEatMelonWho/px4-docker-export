name: Export Docker Image

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and save image
        run: |
          docker pull jaey/pixhawk:px4-gazebo-harmonic
          docker save jaey/pixhawk:px4-gazebo-harmonic -o px4-harmonic.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: px4-harmonic
          path: px4-harmonic.tar
